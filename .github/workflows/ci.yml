name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cache_blog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: core.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cache_blog
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "false"
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Lint (ruff + isort + black --check)
        run: |
          ruff check .
          isort --check-only .
          black --check .

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t cachelayer:ci .
