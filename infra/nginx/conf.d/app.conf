upstream app_upstream {
    server app:8000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;

    # Security headers (production-grade defaults; tighten per-environment)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    # Health and metrics: never rate-limited so probes always succeed.
    location = /api/v1/drf/health/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/ninja/health {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        # Prometheus only; restrict to the docker network.
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://app_upstream;
    }

    # API traffic with rate limit + connection reuse.
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://app_upstream;
    }

    # Admin and static fall through to gunicorn for now; in a real prod
    # deploy you'd serve /static via Nginx directly.
    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
